[package]
name = "cooee-config"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
url = "2"
# Shared config-path resolution + house TOML formatter, pinned by rev in lockstep with the siblings.
config-core = { git = "https://github.com/Lockyc/config-core", rev = "37df5f286f4f10a6f3da661563d89a53420e8dc7" }

[dev-dependencies]
proptest = { version = "=1.12.0", default-features = false, features = ["std"] }
