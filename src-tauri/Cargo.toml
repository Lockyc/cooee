[package]
name = "cooee"
version = "0.1.0"
edition = "2021"
description = "Google Meet with an always-on-top window of the other people's faces. macOS only."
license = "MIT"
repository = "https://github.com/Lockyc/cooee"
readme = "../README.md"
publish = false

[lib]
name = "cooee_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# Shared release tooling + build_stamp (zero-tauri build-dep). Same rev as the runtime entry below.
shell-core = { git = "https://github.com/Lockyc/shell-core", rev = "14a4b9622fa4fa074c285b5f942189684f52ef86", default-features = false }

[dependencies]
# `unstable` for on_new_window (the faces popup); `tray-icon` for the menu-bar item.
tauri = { version = "2.12", features = ["unstable", "devtools", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
# updater/process are registered by shell_core::register_plugins; listed so their capability
# permissions resolve.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
shell-core = { git = "https://github.com/Lockyc/shell-core", rev = "14a4b9622fa4fa074c285b5f942189684f52ef86", features = ["runtime"] }
cooee-config = { path = "../crates/cooee-config" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
